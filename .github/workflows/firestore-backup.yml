name: Firestore Backup

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  export-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix scripts/background-jobs
      - name: Export Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPX_GENERAL_EXPANSIONS }}
        run: node scripts/background-jobs/export-firestore.js
      - name: Push backup branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .git
          git init -b backups
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add backups/
          git commit -m "Firestore backup $(date -u +%F)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin backups --force
      - uses: actions/upload-artifact@v4
        with:
          name: firestore-backup
          path: backups/
          retention-days: 30
